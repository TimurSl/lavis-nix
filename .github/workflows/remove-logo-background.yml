name: One-shot logo background removal

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/remove-logo-background.yml

permissions:
  contents: write

jobs:
  remove-background:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Pillow
        run: |
          sudo apt-get update
          sudo apt-get install --yes python3-pil

      - name: Remove edge-connected black background
        run: |
          python3 - <<'PY'
          from collections import deque
          from pathlib import Path
          from statistics import median
          from PIL import Image

          path = Path("assets/logo.png")
          image = Image.open(path).convert("RGBA")
          width, height = image.size
          pixels = image.load()

          corner_rgb = [
              pixels[0, 0][:3],
              pixels[width - 1, 0][:3],
              pixels[0, height - 1][:3],
              pixels[width - 1, height - 1][:3],
          ]
          background = tuple(int(median(channel)) for channel in zip(*corner_rgb))

          # The background is pure black. Keep #202020 outlines intact by only
          # traversing pixels closer than 26 levels to the corner colour.
          threshold = 26
          feather_start = 8
          visited = bytearray(width * height)
          queue = deque()

          def distance(rgb):
              return max(abs(rgb[index] - background[index]) for index in range(3))

          def enqueue(x, y):
              index = y * width + x
              if visited[index] or distance(pixels[x, y][:3]) > threshold:
                  return
              visited[index] = 1
              queue.append((x, y))

          for x in range(width):
              enqueue(x, 0)
              enqueue(x, height - 1)
          for y in range(height):
              enqueue(0, y)
              enqueue(width - 1, y)

          while queue:
              x, y = queue.popleft()
              if x:
                  enqueue(x - 1, y)
              if x + 1 < width:
                  enqueue(x + 1, y)
              if y:
                  enqueue(x, y - 1)
              if y + 1 < height:
                  enqueue(x, y + 1)

          transparent = 0
          for y in range(height):
              row = y * width
              for x in range(width):
                  if not visited[row + x]:
                      continue
                  red, green, blue, original_alpha = pixels[x, y]
                  delta = distance((red, green, blue))
                  if delta <= feather_start:
                      alpha = 0
                  else:
                      alpha = round(255 * (delta - feather_start) / (threshold - feather_start))
                  alpha = min(original_alpha, max(0, min(255, alpha)))
                  pixels[x, y] = (red, green, blue, alpha)
                  transparent += alpha < 255

          total = width * height
          if transparent < total // 10:
              raise SystemExit(
                  f"background removal affected only {transparent}/{total} pixels; refusing to commit"
              )

          image.save(path, format="PNG", optimize=True)
          print(
              f"processed {width}x{height}; background={background}; "
              f"transparent_or_feathered={transparent}/{total}"
          )
          PY

      - name: Verify transparent PNG
        run: |
          python3 - <<'PY'
          from PIL import Image
          image = Image.open("assets/logo.png")
          assert image.size == (1254, 1254), image.size
          assert image.mode == "RGBA", image.mode
          alpha = image.getchannel("A")
          assert alpha.getextrema()[0] == 0, alpha.getextrema()
          print("verified", image.size, image.mode, alpha.getextrema())
          PY

      - name: Commit processed logo and remove one-shot workflow
        run: |
          rm .github/workflows/remove-logo-background.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all assets/logo.png .github/workflows/remove-logo-background.yml
          git commit -m "Remove background from logo"
          git push origin HEAD:main
