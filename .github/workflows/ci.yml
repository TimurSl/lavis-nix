name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Cache Nix build results
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock', '**/*.nix', 'Cargo.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 1G

      - name: Cache Cargo dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Test GAF module and artifact
        run: |
          cp modules/gaf/dist/gaf.lmod /tmp/gaf.lmod
          nix develop -c bash -c 'set -euo pipefail; test -z "$(gofmt -l modules/gaf/*.go)"; cd modules/gaf; go test ./...; go vet ./...; ./build-lmod.sh'
          cmp /tmp/gaf.lmod modules/gaf/dist/gaf.lmod
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('modules/gaf/dist/gaf.lmod') as archive:
              assert archive.namelist() == ['module.json', 'gaf']
              assert all(item.compress_type == zipfile.ZIP_STORED for item in archive.infolist())
              modes = {item.filename: (item.external_attr >> 16) & 0o777 for item in archive.infolist()}
              assert modes == {'module.json': 0o600, 'gaf': 0o700}, modes
          PY

      - name: Test Always Online module and artifact
        run: |
          nix develop -c bash -c '
            set -euo pipefail
            unformatted="$(gofmt -l modules/always-online/*.go)"
            if [ -n "$unformatted" ]; then
              printf "%s\n" "Always Online files requiring gofmt:" >&2
              printf "%s\n" "$unformatted" >&2
              exit 1
            fi
            cd modules/always-online
            go test ./...
            go vet ./...
            ./build-lmod.sh
            cp dist/always-online.lmod /tmp/always-online-first.lmod
            ./build-lmod.sh
            cmp /tmp/always-online-first.lmod dist/always-online.lmod
          '
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('modules/always-online/dist/always-online.lmod') as archive:
              assert archive.namelist() == ['module.json', 'always-online']
              assert all(item.compress_type == zipfile.ZIP_STORED for item in archive.infolist())
              modes = {item.filename: (item.external_attr >> 16) & 0o777 for item in archive.infolist()}
              assert modes == {'module.json': 0o600, 'always-online': 0o700}, modes
          PY

      - name: Validate built Always Online manifest
        run: nix develop -c cargo run --quiet -- modules validate modules/always-online/build/module.json

      - name: Check formatting
        run: nix develop -c cargo fmt --check

      - name: Check compilation
        run: nix develop -c cargo check --all-targets --all-features

      - name: Run Clippy
        run: nix develop -c cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: nix develop -c cargo test --all-targets --all-features

      - name: Check flake
        run: nix flake check --print-build-logs

      - name: Build package
        run: nix build --print-build-logs

      - name: Collect failure diagnostics
        if: ${{ failure() }}
        run: |
          mkdir -p ci-diagnostics
          {
            echo '== git status =='
            git status --short
            echo
            echo '== disk usage =='
            df -h .
            echo
            echo '== Nix version =='
            nix --version
            echo
            echo '== module build metadata =='
            sha256sum modules/gaf/module.json modules/always-online/module.json
            find modules/gaf modules/always-online -maxdepth 2 -type f \( -name '*.lmod' -o -name 'module.json' \) -printf '%p %s bytes\n'
          } > ci-diagnostics/summary.txt

      - name: Upload failure diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-diagnostics/
          if-no-files-found: ignore
          retention-days: 3
          compression-level: 9
